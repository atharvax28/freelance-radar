name: Scrape Freelance Jobs

on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub's own scheduler (best-effort, often delayed)
  workflow_dispatch:        # Manual "Run workflow" button
  repository_dispatch:      # External pinger (e.g. cron-job.org) for reliable timing
    types: [scrape]

permissions:
  contents: write           # allow the Actions bot to commit data/jobs.json

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scraper + push Telegram feed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          TELEGRAM_MAX_SEND: ${{ vars.TELEGRAM_MAX_SEND || '15' }}
          RECENCY_DAYS: ${{ vars.RECENCY_DAYS || '60' }}
          MAX_RESULTS: ${{ vars.MAX_RESULTS || '80' }}
        run: npx tsx scripts/scrape.ts

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add data/jobs.json
          git commit -m "Auto-update scraped freelance jobs [skip ci]" || exit 0
          git push
